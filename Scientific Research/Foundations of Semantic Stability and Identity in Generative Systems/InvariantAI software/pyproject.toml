[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invariantai"
version = "1.0.0"
description = "Reasoning policy enforcement tool for invariant-preserving semantic traversal"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Moneta Analytica"}
]
keywords = [
    "reasoning",
    "policy",
    "invariant",
    "semantic",
    "nlp",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[project.scripts]
invariantai = "invariantai.reasoning:main"

[project.urls]
"Homepage" = "https://github.com/moneta-analytica/invariantai"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
invariantai = ["*.yaml"]
