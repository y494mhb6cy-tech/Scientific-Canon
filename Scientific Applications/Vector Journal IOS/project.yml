name: VectorJournal
options:
  bundleIdPrefix: com.vectorjournal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: "NO"
    INFOPLIST_FILE: VectorJournal/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.vectorjournal.app
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  VectorJournal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VectorJournal
        excludes:
          - "*.md"
    settings:
      base:
        INFOPLIST_FILE: VectorJournal/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.vectorjournal.app
    entitlements:
      path: VectorJournal/VectorJournal.entitlements
